<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Second Look / 第二眼: a second opinion on your photos. Runs in the browser, uploads nothing, uses no model. Fixes exposure, haze, color cast and tilt by fixed rules, then lets you pick a style and a crop.">
<title>Second Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: photo on a neutral gray surround (so color judgments stay honest); on the right the scope,
   then three tabs: what was measured and fixed, color, crop. The film strip sits under the photo. */
:root {
  --bg: #e6e9e9;
  --panel: #f4f6f6;
  --raise: #ffffff;
  --line: #cdd3d3;
  --fg: #1b2123;
  --muted: #586366;
  --accent: #0a7c84;
  --accent-fg: #ffffff;
  --stage: #c4c4c4;
  --scope: #17191a;
  --ok: #2a7a4b;
  --tip: #9a5b00;
  --warn: #b23a2c;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #222526; --panel: #2a2e2f; --raise: #33383a; --line: #3f4648;
    --fg: #e9eded; --muted: #9ba6a8; --accent: #45c6c1; --accent-fg: #062b2b;
    --stage: #161718; --ok: #6fd09a; --tip: #f0b450; --warn: #f27f70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #222526; --panel: #2a2e2f; --raise: #33383a; --line: #3f4648;
  --fg: #e9eded; --muted: #9ba6a8; --accent: #45c6c1; --accent-fg: #062b2b;
  --stage: #161718; --ok: #6fd09a; --tip: #f0b450; --warn: #f27f70;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 352px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "bar bar" "stage side" "strip side";
  column-gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
}

/* ---- top bar ---- */
.bar { grid-area: bar; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand .wm { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; line-height: 1; }
.brand .cn { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); }
.meta { flex: 1 1 160px; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta b { color: var(--fg); font-weight: 500; font-family: var(--sans); font-size: 13px; margin-right: 10px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }

.btn {
  border: 1px solid var(--line); background: var(--raise); border-radius: 6px;
  padding: 6px 14px; cursor: pointer; white-space: nowrap; line-height: 1.3;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); background: transparent; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.icon:hover { border-color: var(--muted); }
.icon svg { width: 17px; height: 17px; display: block; }

/* ---- stage ---- */
.stage { grid-area: stage; position: relative; background: var(--stage); border-radius: 8px; overflow: hidden; min-height: 240px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.crop canvas { touch-action: none; }
.hold { position: absolute; left: 10px; bottom: 10px; border: 0; border-radius: 999px; padding: 6px 14px; background: var(--scope); color: #e9eded; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.hold:active, .hold.on { background: #e9eded; color: #17191a; }
.drop { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--stage) 80%, transparent); font-size: 16px; font-weight: 600; pointer-events: none; }
.toast { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); background: var(--scope); color: #e9eded; padding: 6px 14px; border-radius: 6px; max-width: calc(100% - 24px); text-align: center; pointer-events: none; }

/* ---- film strip ---- */
.strip { grid-area: strip; display: flex; align-items: center; gap: 10px; padding-top: 10px; min-width: 0; }
.add { flex: none; display: grid; place-items: center; text-align: center; width: 86px; height: 64px; border: 1.5px dashed var(--muted); border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1.3; }
.add:hover, .add:focus-within { border-color: var(--accent); color: var(--accent); }
.add strong { display: block; font-size: 20px; line-height: 1; font-weight: 400; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; padding: 3px; scrollbar-width: thin; }
.thumb { flex: none; position: relative; width: 86px; height: 64px; padding: 0; border: 0; border-radius: 5px; background: var(--stage); cursor: pointer; overflow: hidden; outline: 2px solid transparent; outline-offset: 1px; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb[aria-current="true"] { outline-color: var(--accent); }
.thumb .tag { position: absolute; left: 3px; bottom: 3px; background: var(--scope); color: #e9eded; font-size: 10px; padding: 0 5px; border-radius: 3px; }
.privacy { flex: none; margin: 0; font-size: 12px; color: var(--muted); }

/* ---- side panel ---- */
.side { grid-area: side; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.scope { background: var(--scope); padding: 8px 10px 6px; }
.scope canvas { display: block; width: 100%; height: 76px; }
.scope .legend { display: flex; justify-content: space-between; color: #9ba6a8; margin-top: 3px; min-height: 18px; }
.scope .legend .hot { color: #f27f70; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 4px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.groups { display: flex; flex-direction: column; gap: 16px; }
h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.lead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lead strong { font-size: 15px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; }

/* findings: what was measured, and a switch for each fix */
.findings { display: flex; flex-direction: column; }
.finding { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px; align-items: center; }
.finding:last-child { border-bottom: 1px solid var(--line); }
.finding .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.finding[data-s="tip"] .dot { background: var(--tip); border-radius: 2px; }
.finding[data-s="warn"] .dot { background: var(--warn); border-radius: 0; transform: rotate(45deg); }
.finding .t { font-weight: 600; }
.finding .t small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
.finding[data-s="tip"] .t small { color: var(--tip); }
.finding[data-s="warn"] .t small { color: var(--warn); }
.finding .m { grid-column: 2 / 4; margin: 0; color: var(--muted); font-size: 13px; }
.finding .fix { grid-column: 2 / 4; color: var(--fg); }
.sw { flex: none; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--raise); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { left: 18px; box-shadow: none; }
.swatches { display: flex; height: 24px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.swatches span { min-width: 6px; }

/* sliders */
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; }
.row label { font-size: 13px; }
.row output { color: var(--muted); min-width: 4ch; text-align: right; }
.row input[type="range"] { grid-column: 1 / 3; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; --a: 50%; --b: 50%; --trk: linear-gradient(to right, var(--line) 0, var(--line) var(--a), var(--accent) var(--a), var(--accent) var(--b), var(--line) var(--b), var(--line) 100%); }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--trk); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--trk); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--fg); border: 2px solid var(--panel); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--fg); border: 2px solid var(--panel); }
input.t-temp { --trk: linear-gradient(to right, #4f8fe6, #b9bcbc, #e8a53a); }
input.t-tint { --trk: linear-gradient(to right, #46b76a, #b9bcbc, #cf5fc0); }
input.t-hue { --trk: linear-gradient(to right, #e05555, #d8c043, #4fbf6a, #43c4cf, #4f6fe6, #c455d8, #e05555); }
input.t-aqua { --trk: linear-gradient(to right, #5a6fe0, #3f9fe0, #2fc4b8); }
details summary { cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
details .group { margin-top: 8px; }

/* pictures to tap: styles and crops */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
.tile { border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: center; position: relative; }
.tile .pic { width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center; border-radius: 5px; background: var(--stage); outline: 2px solid transparent; outline-offset: 1px; overflow: hidden; }
.tile canvas { max-width: 100%; display: block; }
.tile.fill canvas { width: 100%; height: 100%; }
.tile[aria-pressed="true"] .pic { outline-color: var(--accent); }
.tile span { font-size: 12px; }
.tile[aria-pressed="true"] span { color: var(--accent); font-weight: 600; }
.tile .star { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-style: normal; line-height: 18px; text-align: center; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.meters { display: grid; grid-template-columns: auto minmax(0, 1fr) 3ch; gap: 6px 10px; align-items: center; font-size: 13px; }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meters .num { text-align: right; color: var(--muted); }

/* export fallback sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--scope) 88%, transparent); display: grid; place-items: center; padding: 20px; }
.sheet .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.sheet img { max-height: 55vh; object-fit: contain; border-radius: 4px; background: var(--stage); }
.sheet p { margin: 0; }

@media (max-width: 899px) {
  html, body { height: auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .app { display: flex; flex-direction: column; height: auto; }
  .bar { padding-block: 8px; }
  .brand .wm { font-size: 21px; }
  .meta { flex-basis: 100%; order: 3; }
  .stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: 44vh; height: 44svh; min-height: 230px; flex: none; box-shadow: 0 0 0 8px var(--bg); }
  .strip { flex-wrap: wrap; }
  .privacy { flex-basis: 100%; }
  .side { margin-top: 12px; overflow: visible; }
  .pane { overflow: visible; }
  input[type="range"] { height: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .icon, .chip, .thumb, .tile .pic, .sw, .sw::after { transition: border-color 0.12s, outline-color 0.12s, background-color 0.12s, left 0.12s; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="wm">Second Look</span><span class="cn" id="brandCn">第二眼</span></div>
    <div class="meta num" id="meta"></div>
    <div class="actions">
      <button class="icon" id="btnLang" data-i18n-label="a.lang">EN</button>
      <button class="icon" id="btnTheme" data-i18n-label="a.theme"></button>
      <button class="btn" id="btnExportAll" data-i18n="saveAll" hidden>Save all</button>
      <button class="btn primary" id="btnExport" data-i18n="save">Save</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" data-i18n-label="a.preview"></canvas>
    <button class="hold" id="btnCompare" data-i18n="compare">Hold for original</button>
    <div class="drop" id="drop" data-i18n="drop" hidden>Drop to add</div>
    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <section class="strip">
    <label class="add" for="file"><span><strong>＋</strong><span data-i18n="add">Add photos</span></span>
      <input class="vh" id="file" type="file" accept="image/*" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <p class="privacy" data-i18n="privacy">Photos stay on this device</p>
  </section>

  <aside class="side">
    <div class="scope">
      <canvas id="hist" width="640" height="152" data-i18n-label="a.hist"></canvas>
      <div class="legend num"><span id="clipLo"></span><span id="clipHi"></span></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-diag" aria-selected="true" aria-controls="pane-diag" data-i18n="tab.diag">Diagnose</button>
      <button role="tab" id="tab-color" aria-selected="false" aria-controls="pane-color" data-i18n="tab.color">Color</button>
      <button role="tab" id="tab-crop" aria-selected="false" aria-controls="pane-crop" data-i18n="tab.crop">Crop</button>
    </div>

    <div class="pane" id="pane-diag" role="tabpanel" aria-labelledby="tab-diag">
      <div class="lead"><strong id="diagLead"></strong><button class="btn sm primary" id="btnFixAll" hidden>Fix all</button></div>
      <div class="findings" id="findings"></div>
      <div class="group"><h3 data-i18n="h.palette">Palette</h3><div class="swatches" id="swatches"></div><p class="hint" id="paletteNote"></p></div>
      <div class="foot"><button class="btn sm" id="btnFixEvery" data-i18n="fixEvery" hidden>Fix every photo</button><button class="btn sm" id="btnReset" data-i18n="reset">Reset</button></div>
    </div>

    <div class="pane" id="pane-color" role="tabpanel" aria-labelledby="tab-color" hidden>
      <div class="group">
        <h3 data-i18n="h.style">Style</h3>
        <div class="tiles" id="looks"></div>
        <div class="row"><label for="s-lookAmt" data-i18n="strength">Strength</label><output id="o-lookAmt" class="num">70</output>
          <input type="range" id="s-lookAmt" min="0" max="100" step="1" value="70"></div>
      </div>
      <div class="groups" id="sliders"></div>
      <div class="foot">
        <button class="btn sm" id="btnResetColor" data-i18n="resetColor">Reset color</button>
        <button class="btn sm" id="btnSync" data-i18n="applyAll" hidden>Apply to all photos</button>
      </div>
    </div>

    <div class="pane" id="pane-crop" role="tabpanel" aria-labelledby="tab-crop" hidden>
      <div class="group"><h3 data-i18n="h.ratio">Shape</h3><div class="chips" id="aspects"></div></div>
      <div class="group">
        <div class="row"><label for="s-angle" data-i18n="s.rotate">Straighten</label><output id="o-angle" class="num">0.0°</output>
          <input type="range" id="s-angle" min="-15" max="15" step="0.1" value="0"></div>
        <div class="foot"><button class="btn sm" id="btnLevel" data-i18n="autoLevel">Level the horizon</button><button class="btn sm" id="btnResetCrop" data-i18n="resetCrop">Reset crop</button></div>
      </div>
      <div class="group"><h3 data-i18n="h.guides">Guides</h3><div class="chips" id="overlays"></div></div>
      <div class="group"><h3 data-i18n="h.crops">Suggested crops</h3><div class="tiles" id="crops"></div><p class="hint" data-i18n="hint.subject">Tap the photo to mark the subject.</p></div>
      <div class="group"><h3 data-i18n="h.now">This framing</h3><div class="meters" id="meters"></div></div>
    </div>
  </aside>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card">
    <img id="sheetImg" alt="">
    <p data-i18n="sheet.hint">Long-press or right-click the picture to save it.</p>
    <button class="btn" id="sheetClose" data-i18n="close">Close</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'text') e.textContent = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
/* yield to the browser without timer throttling in background tabs */
const tick = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
const signed = (v, d = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

/* ================= language ================= */
const STR = {
  zh: {
    'tab.diag': '诊断', 'tab.color': '调色', 'tab.crop': '裁剪',
    save: '保存', saveAll: '全部保存', busy: '处理中 {p}%', busyN: '处理中 {i} / {n}',
    add: '添加照片', privacy: '照片不会上传', sample: '示例', sampleName: '示例：梦莲湖，Gorgo 摄，公有领域（已故意调暗调歪）', compare: '按住看原图', drop: '松手添加',
    reset: '重置这张', resetColor: '重置调色', resetCrop: '重置裁剪', autoLevel: '自动摆正', strength: '风格强度', applyAll: '把调色用到全部照片', close: '关闭', go: '去看看',
